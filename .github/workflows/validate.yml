name: Validar JavaScript do São Marcos
on:
  pull_request:
  push:
    branches:
      - feature/**
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checar se o bundle corresponde aos módulos
        run: node tools/build.mjs --check
      - name: Checar sintaxe do JavaScript entregue
        run: node --check dist/app.bundle.js
